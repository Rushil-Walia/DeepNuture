server.port=9090
spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Load Balancer configuration (routes)
spring.cloud.gateway.routes[0].id=account-service-route
spring.cloud.gateway.routes[0].uri=lb://account-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/accounts/**

spring.cloud.gateway.routes[1].id=loan-service-route
spring.cloud.gateway.routes[1].uri=lb://loan-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/loans/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=loanCircuitBreaker

spring.cloud.gateway.routes[2].id=greet-service-route
spring.cloud.gateway.routes[2].uri=lb://greet-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/greet/**

# Resilience4j properties
resilience4j.circuitbreaker.instances.loanCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.loanCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.loanCircuitBreaker.failureRateThreshold=50
